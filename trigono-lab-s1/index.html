<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrigonoLab S1</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:24px}
.spin{width:40px;height:40px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><p>Memuat TrigonoLab S1...</p></div>
<script>
(async () => {
  const n = 9;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('data' + i + '.txt');
    parts.push(await r.text());
  }
  const bin = atob(parts.join(''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = new TextDecoder('utf-8').decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.innerHTML = '<div class="box"><p>Gagal memuat. Coba refresh.</p><pre style="color:#f87171;text-align:left;max-width:90vw;overflow:auto">'+e+'</pre></div>';
});
</script>
</body>
</html>
